<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相册</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header wrap">
        <a class="site-header__brand" href="index.html"><span class="brand-name"></span><span class="dot">.</span>BLOG</a>
        <nav class="site-header__nav meta" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="article_list.html">文章</a>
        </nav>
    </header>

    <main>
        <section class="page-head wrap">
            <div class="page-head__bar">
                <span class="label"><span class="num">02</span>&nbsp;&nbsp;相册 / GALLERY</span>
                <span class="meta" id="count">—</span>
            </div>
            <h1 class="h1 page-head__title">相册</h1>
        </section>

        <div class="wrap"><div class="red-bar"></div></div>

        <div class="gallery wrap" id="imageGrid"></div>
    </main>

<script>
    const esc = s => String(s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    fetch('config.txt')
        .then(res => res.text())
        .then(text => {
            const name = text.split('\n').map(l => l.trim()).filter(Boolean)[0];
            if (name) {
                document.title = '相册 — ' + name;
                document.querySelectorAll('.brand-name').forEach(el => el.textContent = name);
            }
        })
        .catch(err => console.error("读取config.txt失败", err));

    fetch('picture_list.txt')
        .then(res => res.text())
        .then(text => {
            const images = text.split('\n').map(l => l.trim()).filter(Boolean);
            const grid = document.getElementById('imageGrid');
            document.getElementById('count').textContent =
                '共 ' + String(images.length).padStart(2, '0') + ' 帧';

            grid.innerHTML = '';
            images.forEach((img, i) => {
                const a = document.createElement('a');
                a.className = 'gallery-item';
                a.href = 'picture/' + encodeURIComponent(img);
                a.target = '_blank';
                a.rel = 'noopener';
                a.innerHTML =
                    '<div class="gallery-item__media">' +
                        '<img src="picture/' + encodeURIComponent(img) + '" alt="' + esc(img) + '" loading="lazy">' +
                    '</div>' +
                    '<div class="gallery-item__cap">' +
                        '<span class="meta cap-name">' + esc(img) + '</span>' +
                        '<span class="num meta">' + String(i + 1).padStart(2, '0') + '</span>' +
                    '</div>';
                grid.appendChild(a);
            });
        })
        .catch(err => console.error("读取图片列表失败", err));
</script>
</body>
</html>
