<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header wrap">
        <a class="site-header__brand" href="index.html"><span class="brand-name"></span><span class="dot">.</span>BLOG</a>
        <nav class="site-header__nav meta" aria-label="主导航">
            <a href="article_list.html">文章</a>
            <a href="picture_list.html">相册</a>
        </nav>
    </header>

    <section class="hero wrap">
        <h1 class="display" id="siteName"></h1>

        <div class="hero__bottom">
            <p class="h2" id="siteTagline"></p>
        </div>
    </section>

    <div class="wrap"><div class="red-bar"></div></div>

    <nav class="index-nav wrap" aria-label="栏目">
        <a class="index-row" href="article_list.html">
            <span class="index-row__num num">01</span>
            <span class="index-row__title h2">文章</span>
            <span class="index-row__en meta">ARTICLES →</span>
        </a>
        <a class="index-row" href="picture_list.html">
            <span class="index-row__num num">02</span>
            <span class="index-row__title h2">相册</span>
            <span class="index-row__en meta">GALLERY →</span>
        </a>
    </nav>

    <section class="about wrap">
        <div class="grid">
            <div class="about__head">
                <span class="about__head-num num">03</span>
                <span class="about__head-title h2">关于</span>
                <span class="about__head-en meta">ABOUT / <span class="brand-name"></span></span>
            </div>

            <div class="about__list" id="aboutContainer">
                <div class="about-row">
                    <span class="about-row__num num">01</span>
                    <span class="about-row__text">加载中…</span>
                </div>
            </div>

            <figure class="figure about__figure">
                <a class="figure__media" href="picture_list.html" title="前往相册">
                    <img id="randomImage" src="" alt="随机照片">
                </a>
                <figcaption class="figure__cap">
                    <span class="meta"><span class="num">▮</span>&nbsp; 随机影像</span>
                    <span class="meta">RANDOM / COLOR</span>
                </figcaption>
            </figure>
        </div>
    </section>

<script>
    const esc = s => String(s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    // 1. 读取 config.txt：第一行站点名，第二行副标题
    fetch('config.txt')
        .then(res => res.text())
        .then(text => {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            if (lines[0]) {
                document.title = lines[0];
                document.getElementById('siteName').textContent = lines[0];
                document.querySelectorAll('.brand-name').forEach(el => el.textContent = lines[0]);
            }
            if (lines[1]) {
                document.getElementById('siteTagline').textContent = lines[1];
            }
        })
        .catch(err => console.error("读取config.txt失败", err));

    // 2. 读取 about.txt，渲染为编号信息行
    fetch('about.txt')
        .then(res => res.text())
        .then(text => {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const container = document.getElementById('aboutContainer');
            container.innerHTML = '';
            lines.forEach((line, i) => {
                const row = document.createElement('div');
                row.className = 'about-row';
                const num = String(i + 1).padStart(2, '0');
                row.innerHTML =
                    '<span class="about-row__num num">' + num + '</span>' +
                    '<span class="about-row__text">' + esc(line) + '</span>';
                container.appendChild(row);
            });
        })
        .catch(err => console.error("读取about.txt失败", err));

    // 3. 随机展示相册中的一张照片
    fetch('picture_list.txt')
        .then(res => res.text())
        .then(text => {
            const images = text.split('\n').map(l => l.trim()).filter(Boolean);
            if (images.length > 0) {
                const randomIdx = Math.floor(Math.random() * images.length);
                document.getElementById('randomImage').src = 'picture/' + images[randomIdx];
            }
        })
        .catch(err => console.error("读取图片列表失败", err));
</script>
</body>
</html>
